<!doctype html><html><head><meta charset='utf-8'><style>
@page { size: A4; margin: 14mm 13mm; }
* { box-sizing: border-box; }
body {
  margin: 0;
  background: #fff;
  color: #24292f;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans TC", "Microsoft JhengHei", Arial, sans-serif;
  font-size: 13px;
  line-height: 1.55;
}
.markdown-body {
  max-width: 980px;
  margin: 0 auto;
}
h1, h2, h3, h4, h5, h6 {
  margin: 24px 0 16px;
  font-weight: 600;
  line-height: 1.25;
  page-break-after: avoid;
}
h1 {
  padding-bottom: .3em;
  font-size: 2em;
  border-bottom: 1px solid #d8dee4;
}
h2 {
  padding-bottom: .3em;
  font-size: 1.5em;
  border-bottom: 1px solid #d8dee4;
}
h3 { font-size: 1.25em; }
p, ul, table, .code-block { margin-top: 0; margin-bottom: 16px; }
ul { padding-left: 2em; }
li + li { margin-top: .25em; }
a { color: #0969da; text-decoration: none; }
code {
  padding: .2em .4em;
  margin: 0;
  font-size: 85%;
  white-space: break-spaces;
  background-color: rgba(175, 184, 193, .2);
  border-radius: 6px;
  font-family: ui-monospace, SFMono-Regular, SFMono-Regular, Consolas, "Liberation Mono", Menlo, monospace;
}
.code-block {
  position: relative;
  page-break-inside: avoid;
}
pre {
  padding: 16px;
  overflow-wrap: anywhere;
  white-space: pre-wrap;
  background-color: #f6f8fa;
  border-radius: 6px;
  border: 1px solid #d8dee4;
  font-size: 12px;
  line-height: 1.45;
}
pre code {
  padding: 0;
  background: transparent;
  border-radius: 0;
  font-size: 100%;
}
table {
  display: table;
  width: 100%;
  border-spacing: 0;
  border-collapse: collapse;
  page-break-inside: auto;
  font-size: 11.5px;
}
tr { page-break-inside: avoid; }
th, td {
  padding: 6px 8px;
  border: 1px solid #d0d7de;
  vertical-align: top;
  word-break: break-word;
}
th {
  font-weight: 600;
  background-color: #f6f8fa;
}
tbody tr:nth-child(even) { background-color: #f6f8fa; }
.diagram {
  margin: 0 0 16px;
  page-break-inside: avoid;
}
.diagram svg {
  width: 100%;
  height: auto;
  display: block;
}
.photo-figure {
  margin: 0 0 18px;
  page-break-inside: avoid;
}
.photo-figure img {
  display: block;
  max-width: 100%;
  max-height: 170mm;
  margin: 0 auto;
  border: 1px solid #d8dee4;
  border-radius: 6px;
}
.photo-figure figcaption {
  margin-top: 6px;
  color: #57606a;
  font-size: 12px;
  text-align: center;
}
.table-image {
  display: block;
  max-width: 128px;
  max-height: 88px;
  width: auto;
  height: auto;
  object-fit: contain;
  margin: 0 auto;
  border: 1px solid #d8dee4;
  border-radius: 4px;
}
.node-box {
  fill: #f6f8fa;
  stroke: #d8dee4;
  stroke-width: 1;
}
.node-text {
  fill: #24292f;
  font-size: 22px;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans TC", "Microsoft JhengHei", Arial, sans-serif;
}
    .edge {
  stroke: #8c959f;
  stroke-width: 3;
  stroke-linecap: round;
  stroke-linejoin: round;
}
.edge-label-bg {
  fill: #ffffff;
}
.edge-label {
  fill: #57606a;
  font-size: 19px;
  paint-order: stroke;
  stroke: #fff;
  stroke-width: 5px;
  stroke-linejoin: round;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans TC", "Microsoft JhengHei", Arial, sans-serif;
}
@media print {
  body { print-color-adjust: exact; -webkit-print-color-adjust: exact; }
  h2 { break-before: auto; }
}
</style></head><body><main class='markdown-body'><figure class="diagram">
