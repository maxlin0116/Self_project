[env:arduino_voltage_monitor]
platform = atmelavr
board = megaatmega2560
framework = arduino
monitor_speed = 115200
upload_port = COM10
monitor_port = COM10
build_src_filter =
  +<voltage_monitor.cpp>
  -<mega2560_controller.cpp>
  -<esp32_bridge.cpp>
  -<mega2560_arm_test.cpp>
  -<mega2560_car_arm_controller.cpp>

