[platformio]
default_envs =
  mega2560
  esp32_bridge
  glove_sender
  glove_arduino_uno

[env:mega2560]
platform = atmelavr
board = megaatmega2560
framework = arduino
monitor_speed = 115200
build_src_filter =
  +<mega2560_controller.cpp>
  -<esp32_bridge.cpp>
  -<mega2560_arm_test.cpp>
  -<mega2560_car_arm_controller.cpp>
  -<voltage_monitor.cpp>

[env:esp32_bridge]
platform = espressif32@7.0.0
board = esp32dev
framework = arduino
monitor_speed = 115200
build_src_filter =
  +<esp32_bridge.cpp>
  -<mega2560_controller.cpp>
  -<mega2560_arm_test.cpp>
  -<mega2560_car_arm_controller.cpp>
  -<voltage_monitor.cpp>

[env:glove_sender]
platform = espressif32@7.0.0
board = esp32dev
framework = arduino
monitor_speed = 115200
build_src_filter =
  +<glove_sender.cpp>
  -<esp32_bridge.cpp>
  -<mega2560_controller.cpp>
  -<mega2560_arm_test.cpp>
  -<mega2560_car_arm_controller.cpp>
  -<voltage_monitor.cpp>

[env:glove_arduino_uno]
platform = atmelavr
board = uno
framework = arduino
monitor_speed = 115200
build_src_filter =
  +<glove_arduino_reader.cpp>
  -<glove_sender.cpp>
  -<esp32_bridge.cpp>
  -<mega2560_controller.cpp>
  -<mega2560_arm_test.cpp>
  -<mega2560_car_arm_controller.cpp>
  -<voltage_monitor.cpp>

[env:glove_arduino_mega]
platform = atmelavr
